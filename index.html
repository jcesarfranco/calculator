<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-theme="dark" data-mode="simple" data-history="visible">
    <div class="calculator">
      <div class="display-panel">
        <div class="expression" id="expression">0</div>
        <div class="result" id="display" aria-live="polite">0</div>
      </div>

      <div class="toolbar">
        <button class="btn btn-history-toggle" data-action="mode-toggle" type="button">Scientific</button>
        <button class="btn btn-history-toggle" data-action="theme" type="button">Theme</button>
        <button class="btn btn-history-toggle" data-action="history-toggle" type="button">Hide History</button>
      </div>

      <div class="history-panel" id="historyPanel">
        <div class="history-header">
          <h3>History</h3>
          <button class="btn btn-history-clear" data-action="clear-history" type="button">Clear</button>
        </div>
        <ul id="historyList" class="history-list"></ul>
      </div>

      <div class="buttons">
        <button class="btn btn-utility" data-action="clear">C</button>
        <button class="btn btn-utility" data-action="delete">DEL</button>
        <button class="btn btn-utility" data-action="toggle-sign">±</button>
        <button class="btn btn-operator" data-action="operator" data-value="/">÷</button>

        <button class="btn" data-action="number" data-value="7">7</button>
        <button class="btn" data-action="number" data-value="8">8</button>
        <button class="btn" data-action="number" data-value="9">9</button>
        <button class="btn btn-operator" data-action="operator" data-value="*">×</button>

        <button class="btn" data-action="number" data-value="4">4</button>
        <button class="btn" data-action="number" data-value="5">5</button>
        <button class="btn" data-action="number" data-value="6">6</button>
        <button class="btn btn-operator" data-action="operator" data-value="-">−</button>

        <button class="btn" data-action="number" data-value="1">1</button>
        <button class="btn" data-action="number" data-value="2">2</button>
        <button class="btn" data-action="number" data-value="3">3</button>
        <button class="btn btn-operator" data-action="operator" data-value="+">+</button>

        <button class="btn btn-zero" data-action="number" data-value="0">0</button>
        <button class="btn" data-action="decimal">.</button>
        <button class="btn btn-equals" data-action="equals">=</button>
        <button class="btn btn-scientific" data-action="sqrt">√</button>

        <button class="btn btn-scientific" data-action="square">x²</button>
        <button class="btn btn-scientific" data-action="power" data-value="^">xʸ</button>
        <button class="btn btn-scientific" data-action="reciprocal">1/x</button>
        <button class="btn btn-scientific" data-action="sin">sin</button>

        <button class="btn btn-scientific" data-action="cos">cos</button>
        <button class="btn btn-scientific" data-action="tan">tan</button>
        <button class="btn btn-scientific" data-action="log">log</button>
        <button class="btn btn-scientific" data-action="ln">ln</button>

        <button class="btn btn-scientific" data-action="constant" data-value="pi">π</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
